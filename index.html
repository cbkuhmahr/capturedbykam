<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CAPTUREDBY_KAM</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Optional: Space Mono (close to the vibe you showed) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-block" aria-label="Captured by Kam brand block">
        <div class="brand-name">CAPTUREDBY_KAM</div>
        <div class="brand-line">Every Frame, Every Project</div>
        <div class="brand-line">Timeless Authenticity</div>
        <div class="brand-est">Est. 2025</div>
      </div>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#about">About</a>
        <span class="sep">|</span>
        <a href="#services">Services</a>
        <span class="sep">|</span>
        <a href="#book">Book</a>
        <span class="sep">|</span>
        <a href="#gallery">Gallery</a>
        <span class="sep">|</span>
        <a href="#order">Online Order Form</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- HERO: replace hero.jpg with your photo -->
    <section class="hero" aria-label="Hero image">
      <img class="hero-img" src="hero.jpg" alt="" />
    </section>

    <!-- Empty anchors for now (so the menu works immediately) -->
    <section id="about"></section>
    <section id="services"></section>
    <section id="book"></section>
    <section id="gallery"></section>
    <section id="order"></section>
  </main>
</body>
</html>
