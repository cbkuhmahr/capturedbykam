<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captured by Kam</title>
  <meta name="description" content="Captured by Kam gallery, booking, PhotoDay, and shop." />
  <script src="https://cdn.jsdelivr.net/npm/@mirrorapp/iframe-bridge@latest/dist/index.umd.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f3ee; color: #111; font-family: Arial, Helvetica, sans-serif; }
    a { color: inherit; text-decoration: none; }
    .menu-state { position: absolute; opacity: 0; pointer-events: none; }
    .site { width: min(100% - 28px, 1080px); margin: 34px auto 60px; }
    .hero-card, .feed-card { background: #f8f6f0; border: 1px solid rgba(0,0,0,.10); box-shadow: 0 18px 42px rgba(0,0,0,.10); overflow: hidden; }
    .hero-card { position: relative; border-radius: 8px; margin-bottom: 12px; }
    .hero-image { display: block; width: 100%; height: clamp(340px, 48vw, 560px); object-fit: cover; object-position: center; background: #eee; }
    .brand-card { position: absolute; top: 0; left: 0; z-index: 2; width: min(365px, calc(100% - 120px)); padding: 13px 14px 12px; background: rgba(255,255,255,.92); border-right: 1px solid rgba(0,0,0,.08); border-bottom: 1px solid rgba(0,0,0,.08); border-radius: 0 0 8px 0; box-shadow: 0 10px 22px rgba(0,0,0,.07); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; color: #111; font-weight: 800; letter-spacing: .01em; line-height: 1.12; font-size: clamp(.78rem, 1.75vw, .98rem); text-transform: uppercase; }
    .brand-card .tagline { color: #ea4d2e; }
    .brand-card .year { color: #1f22d4; }
    .menu-button { position: absolute; top: 12px; right: 12px; z-index: 3; height: 42px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,.14); background: rgba(255,255,255,.88); color: #111; box-shadow: 0 10px 22px rgba(0,0,0,.07); cursor: pointer; text-transform: uppercase; letter-spacing: .16em; font-size: .68rem; }
    .menu-panel { position: fixed; inset: 0; z-index: 20; background: #111; color: #f6f3ee; transform: translateX(100%); transition: transform .2s ease; display: grid; place-items: center; padding: 24px; }
    .menu-state:checked ~ .menu-panel { transform: translateX(0); }
    .close-button { position: absolute; top: 18px; right: 18px; width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.20); color: #f6f3ee; font-size: 1.5rem; cursor: pointer; }
    .menu-links { display: grid; gap: 24px; text-align: center; }
    .menu-links a { font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 12vw, 7rem); line-height: .9; letter-spacing: -.06em; }
    .feed-card { border-radius: 4px; padding: 18px; }
    .feed-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
    .feed-title h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 4vw, 3.4rem); line-height: .9; letter-spacing: -.055em; }
    .feed-title p { margin: 6px 0 0; color: rgba(0,0,0,.58); font-size: .95rem; }
    .handle { color: #ea4d2e; text-transform: uppercase; letter-spacing: .18em; font-size: .72rem; white-space: nowrap; }
    .instagram-shell { background: #fff; border: 1px solid rgba(0,0,0,.10); overflow: hidden; }
    .instagram-shell iframe { display: block; width: 100%; border: none; overflow: hidden; }
    .about { max-width: 720px; margin: 28px auto 0; color: rgba(0,0,0,.62); font-size: .95rem; line-height: 1.6; text-align: center; }
    @media (max-width: 640px) { .site { width: min(100% - 16px, 1080px); margin-top: 12px; } .brand-card { font-size: .72rem; width: calc(100% - 100px); } .menu-button { top: 10px; right: 10px; padding: 0 11px; } .feed-head { display: block; } .handle { margin-top: 12px; } }
  </style>
</head>
<body>
  <input class="menu-state" type="checkbox" id="menu-toggle" aria-label="Open menu" />
  <div class="site">
    <section class="hero-card" aria-label="Captured by Kam hero image">
      <div class="brand-card">
        <div>CAPTUREDBY_KAM</div>
        <div class="tagline">EVERY FRAME, EVERY MOMENT -</div>
        <div class="tagline">TIMELESS AUTHENTICITY</div>
        <div>EST. <span class="year">2025</span></div>
      </div>
      <label class="menu-button" for="menu-toggle" aria-label="Open menu">Menu</label>
      <img class="hero-image" alt="Bridge photograph by Captured by Kam" src="assets/bridge-hero.svg" />
    </section>
    <section class="feed-card" aria-label="Instagram feed section">
      <div class="feed-head">
        <div class="feed-title">
          <h1>Latest from the frame.</h1>
          <p>The feed stays front and center.</p>
        </div>
        <div class="handle">@CAPTUREDBY_KAM</div>
      </div>
      <div class="instagram-shell">
        <iframe onload="iFrameSetup(this)" src="https://app.mirror-app.com/feed-instagram/8075e490-f023-4d0e-9574-3e80bf7bbc3f/preview" style="width:100%;border:none;overflow:hidden;" scrolling="no" title="Captured by Kam Instagram gallery"></iframe>
      </div>
    </section>
    <section class="about" id="about">Captured by Kam creates photo and video work for athletes, families, teams, brands, and visual projects.</section>
  </div>
  <aside class="menu-panel" aria-label="Site menu">
    <label class="close-button" for="menu-toggle" aria-label="Close menu">×</label>
    <nav class="menu-links">
      <a href="mailto:kam@capturedbykam.com?subject=Booking%20Request">Book</a>
      <a href="#about">About</a>
      <a href="https://my.photoday.com/s/capturedbykam">PhotoDay</a>
      <a href="shop.html">Shop</a>
    </nav>
  </aside>
  <script>const menuToggle=document.getElementById('menu-toggle');document.querySelectorAll('.menu-panel a').forEach((link)=>{link.addEventListener('click',()=>{menuToggle.checked=false;});});</script>
</body>
</html>
