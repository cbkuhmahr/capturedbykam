<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAPTUREDBY_KAM</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Mono vibe similar to what you showed -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <div class="b1">CAPTUREDBY_KAM</div>
        <div class="b2">Every Frame, Every Project</div>
        <div class="b2">Timeless Authenticity</div>
        <div class="b3">Est. 2025</div>
      </div>

      <nav class="nav" aria-label="Primary">
        <a href="#about">About</a>
        <span class="pipe">|</span>
        <a href="#services">Services</a>
        <span class="pipe">|</span>
        <a href="#book">Book</a>
        <span class="pipe">|</span>
        <a href="#gallery">Gallery</a>
        <span class="pipe">|</span>
        <a href="#order">Online Order Form</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- FULL-WIDTH CINEMATIC HERO -->
    <section class="hero" aria-label="Hero image">
      <!-- Put your photo in the repo as hero.jpg -->
      <img src="hero.jpg" alt="" class="heroImg" />
    </section>

    <!-- Placeholders so menu clicks work -->
    <section id="about" class="section"></section>
    <section id="services" class="section"></section>
    <section id="book" class="section"></section>
    <section id="gallery" class="section"></section>
    <section id="order" class="section"></section>
  </main>
</body>
</html>
