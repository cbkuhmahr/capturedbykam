<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captured by Kam</title>
  <meta name="description" content="Captured by Kam gallery, booking, PhotoDay, and shop." />
  <script src="https://cdn.jsdelivr.net/npm/@mirrorapp/iframe-bridge@latest/dist/index.umd.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f0ea;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .menu-state {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #f3f0ea;
      border-bottom: 1px solid rgba(0,0,0,.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
    }

    .brand {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 800;
      color: #ea4d2e;
      letter-spacing: .02em;
      font-size: clamp(1rem, 3vw, 1.35rem);
    }

    .menu-button,
    .close-button {
      border: 1px solid rgba(0,0,0,.18);
      background: #fff;
      color: #111;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .menu-button {
      min-width: 46px;
      height: 42px;
      padding: 0 14px;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: .7rem;
    }

    .menu-panel {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #111;
      color: #f3f0ea;
      transform: translateX(100%);
      transition: transform .2s ease;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .menu-state:checked ~ .menu-panel {
      transform: translateX(0);
    }

    .close-button {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 46px;
      height: 46px;
      background: transparent;
      color: #f3f0ea;
      border-color: rgba(255,255,255,.22);
      font-size: 1.5rem;
    }

    .menu-links {
      display: grid;
      gap: 24px;
      text-align: center;
    }

    .menu-links a {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 12vw, 7rem);
      line-height: .9;
      letter-spacing: -.06em;
    }

    .menu-links a:hover {
      color: #ea4d2e;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px;
    }

    .instagram-shell {
      background: #fff;
      border: 1px solid rgba(0,0,0,.12);
      overflow: hidden;
    }

    .instagram-shell iframe {
      display: block;
      width: 100%;
      border: none;
      overflow: hidden;
    }

    .about {
      max-width: 720px;
      margin: 32px auto 0;
      padding: 22px 0;
      border-top: 1px solid rgba(0,0,0,.12);
      color: rgba(0,0,0,.7);
      font-size: .95rem;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      .topbar { padding: 12px; }
      main { padding: 12px; }
      .brand { font-size: .95rem; }
    }
  </style>
</head>
<body>
  <input class="menu-state" type="checkbox" id="menu-toggle" aria-label="Open menu" />

  <header class="topbar">
    <a class="brand" href="index.html">CAPTUREDBY_KAM</a>
    <label class="menu-button" for="menu-toggle" aria-label="Open menu">Menu</label>
  </header>

  <aside class="menu-panel" aria-label="Site menu">
    <label class="close-button" for="menu-toggle" aria-label="Close menu">×</label>
    <nav class="menu-links">
      <a href="mailto:kam@capturedbykam.com?subject=Booking%20Request">Book</a>
      <a href="#about">About</a>
      <a href="https://my.photoday.com/s/capturedbykam">PhotoDay</a>
      <a href="shop.html">Shop</a>
    </nav>
  </aside>

  <main>
    <section class="instagram-shell" aria-label="Instagram gallery">
      <iframe onload="iFrameSetup(this)" src="https://app.mirror-app.com/feed-instagram/8075e490-f023-4d0e-9574-3e80bf7bbc3f/preview" style="width:100%;border:none;overflow:hidden;" scrolling="no" title="Captured by Kam Instagram gallery"></iframe>
    </section>

    <section class="about" id="about">
      Captured by Kam creates photo and video work for athletes, families, teams, brands, and visual projects.
    </section>
  </main>

  <script>
    const menuToggle = document.getElementById('menu-toggle');
    document.querySelectorAll('.menu-panel a').forEach((link) => {
      link.addEventListener('click', () => { menuToggle.checked = false; });
    });
  </script>
</body>
</html>
